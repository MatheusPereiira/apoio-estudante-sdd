name: Release — Deploy por Tag vX.Y.Z (ADR-003 / T22 / T53)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify-release:
    name: Verificação Final de Release (CT01–CT08 + EV01–EV04)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
