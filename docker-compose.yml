services:
  postgres:
    image: postgres:16-alpine
    container_name: apoio-estudante-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_dev_password_only
      POSTGRES_DB: apoio_estudante_dev
    ports:
      - "5432:5432"
    volumes:
      - pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d apoio_estudante_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg16_data:
